<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Unique gene states by period</title>
  <style>
    :root {
      --bg: #f3efe7;
      --panel: #fffdf8;
      --ink: #15222c;
      --muted: #64748b;
      --line: #d8ddd8;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1100px 420px at 10% -10%, #e9efe7, transparent),
        radial-gradient(1000px 420px at 100% 0%, #eee3d8, transparent),
        var(--bg);
    }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }
    .head, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .title { font-weight: 800; font-size: 22px; margin-bottom: 4px; }
    .status { color: var(--muted); font-size: 13px; font-family: Consolas, monospace; }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: end;
      margin-top: 10px;
    }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }
    select, button {
      border: 1px solid #8fc8c1;
      border-radius: 9px;
      padding: 8px 12px;
      background: #e6f5f3;
      color: #0f4f48;
      font-weight: 700;
    }
    button { cursor: pointer; }
    label.check-row {
      display: flex;
      color: var(--ink);
      font-weight: 600;
      margin-bottom: 0;
      cursor: pointer;
    }
    canvas { width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
    .hint { color: var(--muted); font-size: 13px; margin-top: 8px; line-height: 1.45; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; }
    th { color: var(--muted); font-size: 12px; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin: 8px 0; font-size: 13px; }
    .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    .check-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 10px;
    }
    .check-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .check-row input { width: auto; }
    .nsp-block { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
    .hub-link { margin: 0 0 8px; font-size: 14px; }
    .hub-link a { color: var(--accent); text-decoration: none; font-weight: 700; }
    .hub-link a:hover { text-decoration: underline; }
  </style>
</head>

      });
      currentNspNames().forEach((name) => {
        if (nspVisibility[name] === undefined) nspVisibility[name] = true;
      });
      currentNspGroupNames().forEach((name) => {
        if (nspGroupVisibility[name] === undefined) nspGroupVisibility[name] = true;
      });
    }

    function visibleGenes() {
      const names = (payload.region_names || []).filter((name) => regionVisibility[name] !== false);
      if ($("show-orf1ab-proteins").checked) {
        if ($("group-nsp-lines").checked) {
          names.push(...currentNspGroupNames().filter((name) => nspGroupVisibility[name] !== false));
        } else {
          names.push(...currentNspNames().filter((name) => nspVisibility[name] !== false));
        }
      }
      return names;
    }

    function bindCheck(container, name, map, redrawOnly) {
      const label = document.createElement("label");
      label.className = "check-row";
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = map[name] !== false;
      box.addEventListener("change", (event) => {
        event.stopPropagation();
        map[name] = box.checked;
        if (redrawOnly) render(false);
        else render(true);
      });
      const swatch = document.createElement("span");
      swatch.className = "swatch";
      swatch.style.background = geneColor(name);
      label.appendChild(box);
      label.appendChild(swatch);
      label.appendChild(document.createTextNode(name));
      container.appendChild(label);
    }

    function renderChecks() {
      ensureVisibilityDefaults();
      const showProteins = $("show-orf1ab-proteins").checked;
      const grouped = $("group-nsp-lines").checked;
      const signature = [
        payload.source_path || "",
        (payload.region_names || []).join(","),
        currentNspNames().join(","),
        currentNspGroupNames().join(","),
        showProteins ? "1" : "0",
        grouped ? "1" : "0",
      ].join("|");
      if (signature === lastCheckSignature) return;
      lastCheckSignature = signature;

      const regionBox = $("region-checks");
      regionBox.innerHTML = "";
      (payload.region_names || []).forEach((name) => bindCheck(regionBox, name, regionVisibility, true));

      const nspBox = $("nsp-checks");
      nspBox.innerHTML = "";
      nspBox.style.display = showProteins ? "" : "none";
      if (!showProteins) return;
      if (grouped) {
        currentNspGroupNames().forEach((name) => bindCheck(nspBox, name, nspGroupVisibility, true));
      } else {
        currentNspNames().forEach((name) => bindCheck(nspBox, name, nspVisibility, true));
      }
    }

    function currentMetric() {
      return $("metric").value || "unique_per_nt";
    }

    function metricLabel(key) {
      const match = METRICS.find((item) => item[0] === key);
      return match ? match[1] : key;
    }

    function drawGroupedBars(canvas, groups, seriesNames, seriesColors, valueLookup, yLabel) {
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);
      if (!groups.length || !seriesNames.length) {
        ctx.fillStyle = "#64748b";
        ctx.font = "16px Georgia";
        ctx.fillText("No data loaded.", 24, 36);
        return;
      }

      const left = 72;
      const right = 18;
      const top = 18;
      const rotateLabels = groups.length > 8;
      const bottom = rotateLabels ? 96 : 58;
      const plotW = width - left - right;
      const plotH = height - top - bottom;
      let yMax = 0;
      for (const group of groups) {
        for (const series of seriesNames) {
          yMax = Math.max(yMax, Number(valueLookup(group, series) || 0));
        }
      }
      if (yMax <= 0) yMax = 1;
      const groupWidth = plotW / groups.length;
      const inner = groupWidth * 0.78;
      const barW = inner / seriesNames.length;

      ctx.strokeStyle = "#e5e7eb";
      ctx.fillStyle = "#334155";
      ctx.font = "12px Georgia";
      for (let i = 0; i <= 5; i++) {
        const t = i / 5;
        const y = top + plotH - t * plotH;
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(left + plotW, y);
        ctx.stroke();
        ctx.fillText(formatNumber(t * yMax), 8, y + 4);
      }

      groups.forEach((group, gi) => {
        const gx = left + gi * groupWidth + (groupWidth - inner) / 2;
        seriesNames.forEach((series, si) => {
          const value = Number(valueLookup(group, series) || 0);
          const barH = (value / yMax) * plotH;
          const x = gx + si * barW;
          const y = top + plotH - barH;
          ctx.fillStyle = seriesColors[si];
          ctx.fillRect(x, y, Math.max(1, barW - 2), barH);
        });
        ctx.fillStyle = "#334155";
        ctx.font = groups.length > 12 ? "10px Georgia" : "12px Georgia";
        if (rotateLabels) {
          ctx.save();
          ctx.translate(gx + inner / 2, height - 12);
          ctx.rotate(-Math.PI / 3.4);
          ctx.textAlign = "right";
          ctx.fillText(String(group), 0, 0);
          ctx.restore();
        } else {
          ctx.textAlign = "center";
          ctx.fillText(String(group), gx + inner / 2, height - 28);
          ctx.textAlign = "start";
        }
      });

      ctx.save();
      ctx.fillStyle = "#334155";
      ctx.font = "12px Georgia";
      ctx.translate(16, top + plotH / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(yLabel, 0, 0);
      ctx.restore();
    }

    function rowMap() {
      const map = new Map();
      for (const row of (payload.rows || [])) {
        map.set(row.period + "\t" + row.gene, row);
      }
      return map;
    }

    function render(rebuildChecks) {
      if (rebuildChecks) lastCheckSignature = "";
      $("status").textContent = payload.status || "";
      renderChecks();
      const metric = currentMetric();
      const groupBy = $("group-by").value || "gene";
      const periods = payload.periods || [];
      const genes = visibleGenes();
      const map = rowMap();
      const lookup = (period, gene) => {
        const row = map.get(period + "\t" + gene);
        return row ? Number(row[metric] || 0) : 0;
      };

      const legend = $("legend");
      legend.innerHTML = "";
      const seriesNames = groupBy === "gene" ? periods : genes;
      const seriesColors = seriesNames.map((name, idx) =>
        groupBy === "gene" ? periodColor(idx) : geneColor(name)
      );
      seriesNames.forEach((name, idx) => {
        const item = document.createElement("div");
        item.innerHTML = `<span class="swatch" style="background:${seriesColors[idx]};"></span>${name}`;
        legend.appendChild(item);
      });

      if (groupBy === "gene") {
        drawGroupedBars(
          $("main-chart"),
          genes,
          periods,
          seriesColors,
          (gene, period) => lookup(period, gene),
          metricLabel(metric)
        );
      } else {
        drawGroupedBars(
          $("main-chart"),
          periods,
          genes,
          seriesColors,
          (period, gene) => lookup(period, gene),
          metricLabel(metric)
        );
      }

      const seqLookup = Object.fromEntries(
        (payload.period_seq || []).map((item) => [item.period, item.n_seq])
      );
      drawGroupedBars(
        $("seq-chart"),
        periods,
        ["n_seq"],
        ["rgba(15, 23, 42, 0.45)"],
        (period) => Number(seqLookup[period] || 0),
        "n_seq"
      );

      const notes = {
        unique_per_nt: "Best for comparing genes inside one period: longer ORFs do not win by length.",
        unique_share: "Best for comparing periods: gene unique count divided by unique full-coding states.",
        unique_per_seq: "Fair inside one period. Across periods it falls when GISAID sampling is dense.",
        n_unique: "Raw unique gene-state count. Tracks both diversity and sample size.",
      };
      $("main-hint").textContent = (notes[metric] || "") +
        ($("show-orf1ab-proteins").checked
          ? (hasNspData()
            ? " Individual NSP bars appear when Group NSP lines is off. nsp11 overlaps the start of nsp12."
            : " This TSV has no nsp rows. Re-run ScateClave with the updated GeneUniqueVariantTracker.")
          : " Enable Show ORF1ab proteins to plot nsp1-nsp16 as separate bars.");

      const visible = new Set(genes);
      const body = $("table-body");
      body.innerHTML = "";
      for (const row of (payload.rows || [])) {
        if (!visible.has(row.gene)) continue;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.period}<div class="status">${row.period_start} to ${row.period_end}</div></td>
          <td>${row.gene}</td>
          <td class="num">${Number(row.n_seq || 0).toLocaleString("en-US")}</td>
          <td class="num">${Number(row.n_unique || 0).toLocaleString("en-US")}</td>
          <td class="num">${formatNumber(row.unique_per_seq)}</td>
          <td class="num">${formatNumber(row.unique_per_nt)}</td>
          <td class="num">${formatNumber(row.unique_share)}</td>`;
        body.appendChild(tr);
      }
    }

    function fillMetricSelect() {
      const select = $("metric");
      select.innerHTML = METRICS.map((item) => `<option value="${item[0]}">${item[1]}</option>`).join("");
      select.value = "unique_per_nt";
    }

    async function openFile() {
      try {
        if (!window.pywebview || !window.pywebview.api) {
          alert("Viewer bridge is not ready yet. Try again in a second.");
          return;
        }
        const chosen = await window.pywebview.api.choose_file();
        if (!chosen || chosen.cancelled) return;
        if (!chosen.ok) {
          alert(chosen.error || "Could not open the file dialog.");
          return;
        }
        const loaded = await window.pywebview.api.load_file(chosen.path);
        if (loaded && loaded.payload) {
          payload = loaded.payload;
          lastCheckSignature = "";
          render(true);
        } else {
          alert((loaded && loaded.status) ? loaded.status : "Failed to load TSV.");
        }
      } catch (error) {
        alert("Failed to open file: " + error);
      }
    }

    fillMetricSelect();
    if (STATIC_MODE) {
      $("open-btn").style.display = "none";
      $("hub-link").hidden = false;
    } else {
      $("open-btn").addEventListener("click", openFile);
    }
    $("metric").addEventListener("change", () => render(false));
    $("group-by").addEventListener("change", () => render(false));
    $("show-orf1ab-proteins").addEventListener("change", () => render(true));
    $("group-nsp-lines").addEventListener("change", () => render(true));
    $("nsp-show-all").addEventListener("click", () => {
      const grouped = $("group-nsp-lines").checked;
      const names = grouped ? currentNspGroupNames() : currentNspNames();
      const map = grouped ? nspGroupVisibility : nspVisibility;
      names.forEach((name) => { map[name] = true; });
      lastCheckSignature = "";
      render(true);
    });
    $("nsp-hide-all").addEventListener("click", () => {
      const grouped = $("group-nsp-lines").checked;
      const names = grouped ? currentNspGroupNames() : currentNspNames();
      const map = grouped ? nspGroupVisibility : nspVisibility;
      names.forEach((name) => { map[name] = false; });
      lastCheckSignature = "";
      render(true);
    });
    render(true);
  </script>
</body>
</html>
